# ============================================================================
#  COVER-LETTER BLUEPRINT  -  the FORM and the GENERAL CONTENT of your letters.
#  You decide the structure here once; the app fills the "generated" paragraphs for each job.
#
#  paragraphs (in this order):
#    kind: fixed      -> your own wording, with {placeholders} filled automatically
#    kind: generated  -> written by the local model from: the job, verified company facts,
#                        your most relevant projects/experience, and your optional note
#
#  Available {placeholders} in fixed texts, subject and signature lines:
#    you:        {name} {email} {phone} {location} {linkedin} {github} {title} {school}
#    the job:    {company} {role_title} {contact_name}
#    your plan:  {internship_label} {internship_label_a} {duration_text} {start_month_year} {start_date_text} {programme} {availability_note}
#  In `salutations` only, the recipient's name:  {full_name} {first_name} {last_name}
#  Unknown placeholders are left untouched (and flagged in the app) so typos are easy to spot.
#
#  To add a paragraph, copy a block. To remove one, delete it. To reorder, move it.
# ============================================================================
name: Standard internship letter (opening, company, fit, availability, closing)
kind: letter

tone:
  en: "Professional, warm and direct. Concrete facts rather than adjectives. First person. No clichés."
  fr: "Professionnel, chaleureux et direct. Des faits concrets plutôt que des adjectifs. Première personne, vouvoiement. Pas de formules toutes faites."

avoid:               # phrases the model must not use (checked automatically)
  en: ["I am writing to apply", "passionate", "dynamic", "team player", "cutting-edge", "perfect fit", "hard-working", "fast learner"]
  fr: ["je me permets de", "passionné", "dynamique", "esprit d'équipe", "à la pointe", "candidat idéal", "motivé et rigoureux", "rapidement opérationnel"]

subject:
  en: "Application – {internship_label}: {role_title} ({start_month_year}, {duration_text})"
  fr: "Candidature – {internship_label} : {role_title} ({start_month_year}, {duration_text})"

salutations:         # default = recipient unknown; the others are used when you enter a contact name
  en:
    default: "Dear Hiring Team,"
    named_neutral: "Dear {full_name},"
    named_ms: "Dear Ms. {last_name},"
    named_mr: "Dear Mr. {last_name},"
    first_name: "Dear {first_name},"
  fr:
    default: "Madame, Monsieur,"
    named_neutral: "Bonjour {full_name},"
    named_ms: "Madame {last_name},"
    named_mr: "Monsieur {last_name},"
    first_name: "Bonjour {first_name},"

closing:
  en: "Kind regards,"
  fr: "Cordialement,"

signature_lines: ["{name}"]

paragraphs:
  - id: intro
    kind: generated
    label: {en: Opening, fr: Introduction}
    max_words: 60
    goal:
      en: "State the role you apply for and the single most specific reason it attracts you (taken from the job's mission, the company facts or the candidate's note). Then, in one short sentence, say who you are (final-year student, field). Do not mention dates or duration: another paragraph covers them."
      fr: "Indiquez le poste visé et la raison la plus précise qui vous y attire (tirée de la mission du poste, des faits sur l'entreprise ou de la note du candidat). Puis, en une courte phrase, présentez-vous (dernière année d'école d'ingénieurs, spécialité). Ne mentionnez ni dates ni durée : un autre paragraphe s'en charge."
    example:
      en: "I would like to join Nimbus Logistics as a backend intern because your route-optimisation API runs in production for customers every day, and I want to learn how a service like that is built and kept reliable. I am in the final year of a software engineering degree, with a focus on backend and infrastructure."
      fr: "Je souhaite rejoindre Nimbus Logistics comme stagiaire backend car votre API d'optimisation de tournées fonctionne chaque jour en production pour vos clients, et je veux comprendre comment un tel service est construit et maintenu fiable. Je suis en dernière année d'école d'ingénieurs en informatique, avec une dominante backend et infrastructure."

  - id: company
    kind: generated
    label: {en: Why this company, fr: Pourquoi cette entreprise}
    max_words: 80
    goal:
      en: "Explain why THIS company. Use one or two concrete COMPANY FACTS (what they build, who uses it, technology, mission) and connect them to what you want to learn or work on. If there are no company facts, talk about the domain of the role and the technologies named in the job instead. Do not describe your own experience in this paragraph (the next one does). Never invent news, values or numbers."
      fr: "Expliquez pourquoi CETTE entreprise. Appuyez-vous sur un ou deux FAITS SUR L'ENTREPRISE concrets (ce qu'ils construisent, qui l'utilise, technologie, mission) et reliez-les à ce que vous voulez apprendre ou faire. S'il n'y a pas de faits sur l'entreprise, parlez plutôt du domaine du poste et des technologies citées dans l'offre. Ne décrivez pas votre propre expérience dans ce paragraphe (le suivant s'en charge). N'inventez ni actualité, ni valeurs, ni chiffres."
    example:
      en: "What attracts me to Nimbus Logistics is that routing is a hard problem with measurable results: every improvement shows up in customers' delivery times. I would like to learn how your team keeps such a service fast and observable at scale."
      fr: "Ce qui m'attire chez Nimbus Logistics, c'est que l'optimisation de tournées est un problème difficile aux résultats mesurables : chaque amélioration se voit dans les délais de livraison des clients. Je voudrais apprendre comment votre équipe garde un tel service rapide et observable à grande échelle."

  - id: fit
    kind: generated
    label: {en: Why me, fr: Pourquoi moi}
    max_words: 120
    goal:
      en: "Show you can contribute quickly. Pick the two most relevant items from the CANDIDATE FACTS, say concretely what you built or did, with which tools and with what result, and link it to the job's requirements. Mention only tools that appear in the CANDIDATE FACTS."
      fr: "Montrez que vous pouvez contribuer rapidement. Choisissez les deux éléments les plus pertinents des FAITS SUR LE CANDIDAT, dites concrètement ce que vous avez construit ou fait, avec quels outils et avec quel résultat, et reliez-le aux exigences de l'offre. Ne citez que des outils présents dans les FAITS SUR LE CANDIDAT."
    example:
      en: "Last year I built a CI/CD pipeline with GitHub Actions and Docker for a team project, which cut deployment time from 20 to 5 minutes, and I added dashboards to monitor it. During my internship at Orbit Labs I containerised four services and wrote the tests that made releases routine. This mix of automation and monitoring is what your role asks for."
      fr: "L'an dernier, j'ai construit un pipeline CI/CD avec GitHub Actions et Docker pour un projet d'équipe, ce qui a fait passer le temps de déploiement de 20 à 5 minutes, et j'ai ajouté des tableaux de bord pour le surveiller. Pendant mon stage chez Orbit Labs, j'ai conteneurisé quatre services et écrit les tests qui ont rendu les mises en production routinières. Cette combinaison d'automatisation et de supervision correspond à ce que demande votre poste."

  - id: logistics
    kind: fixed
    label: {en: Availability, fr: Disponibilité}
    text:
      en: "I am available for {internship_label_a} of {duration_text}, starting {start_month_year}, as part of {programme}. {availability_note}"
      fr: "Je suis disponible pour {internship_label_a} de {duration_text}, à compter de {start_month_year}, dans le cadre de {programme}. {availability_note}"

  - id: close
    kind: fixed
    label: {en: Closing line, fr: Phrase de conclusion}
    text:
      en: "I would be glad to discuss my application in an interview and to show what I could bring to {company}. Thank you for your time and consideration."
      fr: "Je reste à votre disposition pour un entretien, afin de vous présenter plus en détail ma motivation et ce que je pourrais apporter à {company}. Je vous remercie de l'attention portée à ma candidature."
